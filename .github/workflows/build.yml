name: Build desktop apps

# Builds and tests Tracker for Windows (installer + portable) and macOS
# (Apple Silicon + Intel) on every push and pull request. release.yml reuses
# this workflow when a version tag is pushed and then publishes the release.

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "landing/**", "**.md" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win --x64
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - name: macOS
            os: macos-14
            target: --mac --arm64 --x64
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          }

      - name: Check release notes exist
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/release-notes.js "${GITHUB_REF_NAME}" > /dev/null

      - name: Install dependencies
        run: npm ci

      # macOS signing and notarization switch on by themselves once these
      # repository secrets exist (Settings > Secrets and variables > Actions):
      #   MAC_CERT_P12_BASE64   Developer ID Application certificate (.p12), base64
      #   MAC_CERT_PASSWORD     password of that .p12
      #   APPLE_ID              Apple ID email of the developer account
      #   APPLE_APP_PASSWORD    app-specific password for that Apple ID
      #   APPLE_TEAM_ID         10-character team ID
      # Without them, macOS builds are ad-hoc signed and Windows builds unsigned.
      - name: Configure macOS signing
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            node -e '
              const fs = require("fs"); const p = "package.json"; const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
              const mac = pkg.build.mac; delete mac.identity;
              Object.assign(mac, { hardenedRuntime: true, gatekeeperAssess: false, notarize: true,
                entitlements: "assets/entitlements.mac.plist", entitlementsInherit: "assets/entitlements.mac.plist" });
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2));'
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "macOS builds will be signed with Developer ID and notarized."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets not set: building ad-hoc signed (Gatekeeper will warn on first open)."
          fi

      - name: Build ${{ matrix.name }} packages
        shell: bash
        run: |
          if [ "${{ steps.macsign.outputs.signed }}" = "true" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            export APPLE_ID APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_PASSWORD" APPLE_TEAM_ID
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.target }} --publish never
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List artifacts
        shell: bash
        run: ls -lh dist

      # Launch the real packaged app: it opens its database, loads the UI,
      # writes and reads a value, then exits. A broken build fails here.
      - name: Self-test Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export TRACKER_SELFTEST=1 TRACKER_USER_DATA="$RUNNER_TEMP/tracker-selftest"
          ./dist/win-unpacked/Tracker.exe | tee selftest.log
          grep -q "TRACKER_SELFTEST OK" selftest.log

      - name: Verify and self-test macOS DMGs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for dmg in dist/Tracker-macos-arm64.dmg dist/Tracker-macos-x64.dmg; do
            echo "::group::$dmg"
            hdiutil verify "$dmg"
            mnt="$(mktemp -d)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
            test -d "$mnt/Tracker.app"
            test -L "$mnt/Applications"
            codesign --verify --deep --strict --verbose=2 "$mnt/Tracker.app"
            if [ "${{ steps.macsign.outputs.signed }}" = "true" ]; then
              spctl --assess --type execute --verbose=2 "$mnt/Tracker.app"
              xcrun stapler validate "$mnt/Tracker.app"
            fi
            cp -R "$mnt/Tracker.app" "$RUNNER_TEMP/"
            hdiutil detach "$mnt" >/dev/null
            bin="$RUNNER_TEMP/Tracker.app/Contents/MacOS/Tracker"
            run=("$bin")
            if [[ "$dmg" == *x64* ]]; then
              if arch -x86_64 /usr/bin/true 2>/dev/null; then run=(arch -x86_64 "$bin")
              else echo "::warning::Rosetta unavailable; skipping the Intel launch test (DMG and signature verified)"; run=(); fi
            fi
            if (( ${#run[@]} )); then
              TRACKER_SELFTEST=1 TRACKER_USER_DATA="$RUNNER_TEMP/selftest-$(basename "$dmg" .dmg)" "${run[@]}" | tee selftest.log
              grep -q "TRACKER_SELFTEST OK" selftest.log
            fi
            rm -rf "$RUNNER_TEMP/Tracker.app"
            echo "::endgroup::"
          done

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tracker-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
