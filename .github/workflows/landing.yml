name: Landing page

# Checks that the Next.js landing page builds. Deployment is handled by
# Vercel (project Root Directory: landing), which builds on every push.

on:
  push:
    branches: [ "main" ]
    paths: [ "landing/**", ".github/workflows/landing.yml" ]
  pull_request:
    paths: [ "landing/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Validate vercel.json
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"

      - run: npm ci

      - name: Type-check and build
        run: npm run build
